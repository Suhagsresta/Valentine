<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your Roses 🌹</title>

<style>
:root{
  --rose:#ff2d55;
}

body{
  margin:0;
  font-family:system-ui;
  background: radial-gradient(circle at center,#1a0610,#050207);
  color:white;
  overflow-x:hidden;
}

/* LOADER */
#loader{
 position:fixed;
 inset:0;
 background:#050207;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 z-index:100;
}

.barwrap{
 width:260px;
 height:10px;
 background:#222;
 border-radius:20px;
 overflow:hidden;
 margin-top:15px;
}

.bar{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#ff2d55,#ff9bb0);
 transition:width .25s;
}

/* MAIN CARD */
.card{
 max-width:900px;
 margin:60px auto;
 padding:30px;
 text-align:center;
}

/* BIG BOUQUET IMAGE */
.bouquet{
 position:relative;
 width:100%;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 25px 80px rgba(255,45,85,.25);
}

.bouquet img{
 width:100%;
 display:block;
 opacity:0;
 transition:opacity 1.2s ease;
}

/* FALLING PETALS */
.petal{
 position:fixed;
 width:18px;
 height:18px;
 background:radial-gradient(circle,#ff4b6e,#c4002c);
 border-radius:50% 50% 50% 0;
 transform:rotate(45deg);
 animation:fall linear infinite;
 opacity:.7;
}

@keyframes fall{
 from{transform:translateY(-10vh) rotate(0deg);}
 to{transform:translateY(110vh) rotate(360deg);}
}

/* BUTTON */
button{
 margin-top:25px;
 padding:14px 26px;
 font-size:18px;
 border:none;
 border-radius:30px;
 background:linear-gradient(135deg,#ff2d55,#ff7a95);
 color:white;
 cursor:pointer;
 box-shadow:0 10px 40px rgba(255,45,85,.4);
}

/* MESSAGE */
#message{
 display:none;
 margin-top:25px;
 font-size:20px;
 line-height:1.6;
}

.final{
 margin-top:20px;
 font-size:22px;
 color:#ffd6de;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
<h2>Preparing your bouquet… 🌹</h2>
<div class="barwrap"><div class="bar" id="bar"></div></div>
</div>

<div class="card">

<h1>Open your surprise</h1>

<div class="bouquet">
<img id="roseImg"
src="https://images.unsplash.com/photo-1548095115-45697e6c9f86?auto=format&fit=crop&w=2000&q=90"
alt="Large bouquet of red roses">
</div>

<button onclick="openSurprise()">Open your surprise 💌</button>

<div id="message">
I couldn't just send one rose...

<br><br>
So I sent you a whole bouquet.<br>
Not 3.<br>
Not 5.<br>
Not 10.<br>

<b>Fifteen roses — for every thought of you.</b>

<div class="final">
Answer your phone. 🙂
</div>
</div>

</div>

<script>
// slow dramatic loading
let bar=document.getElementById("bar");
let load=0;

let timer=setInterval(()=>{
 load+=Math.random()*6;
 if(load>95) load=95;
 bar.style.width=load+"%";
},200);

let img=document.getElementById("roseImg");
img.onload=()=>{
 clearInterval(timer);
 bar.style.width="100%";
 setTimeout(()=>{
   document.getElementById("loader").style.display="none";
   img.style.opacity=1;
   createPetals();
 },900);
};

// petals
function createPetals(){
 for(let i=0;i<25;i++){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=6+Math.random()*6+"s";
  p.style.opacity=Math.random();
  document.body.appendChild(p);
 }
}

// reveal message
function openSurprise(){
 document.getElementById("message").style.display="block";
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>

</body>
</html>
