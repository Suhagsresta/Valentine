<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your Roses 🌹</title>

<style>
:root{ --rose:#ff2d55; }

body{
  margin:0;
  font-family:system-ui;
  background: radial-gradient(circle at center,#1a0610,#050207);
  color:white;
  overflow-x:hidden;
}

/* LOADER */
#loader{
 position:fixed;
 inset:0;
 background:#050207;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 z-index:100;
 transition:opacity .6s ease;
}

.barwrap{
 width:260px;
 height:10px;
 background:#222;
 border-radius:20px;
 overflow:hidden;
 margin-top:15px;
}
.bar{
 height:100%;
 width:0%;
 background:linear-gradient(90deg,#ff2d55,#ff9bb0);
 transition:width .25s;
}

/* MAIN CARD */
.card{
 max-width:1100px;
 margin:40px auto;
 padding:20px;
 text-align:center;
}

/* BIG BOUQUET IMAGE (AUTO-FITS roses.jpg EXACTLY) */
.bouquet{
  position:relative;
  width:100%;
  max-height:70vh;
  margin:0 auto;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 25px 80px rgba(255,45,85,.25);
  background: radial-gradient(circle at 30% 30%, rgba(255,45,85,.12), rgba(0,0,0,.75));

  /* modern browsers: will be set via JS to match the image */
  aspect-ratio: var(--ar, 3 / 2);
}

/* fallback for older browsers: height comes from padding-top */
.bouquet::before{
  content:"";
  display:block;
  padding-top: var(--pt, 66.6667%);
}

.bouquet img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;   /* <-- NO CROPPING */
  object-position:center;
  opacity:0;
  transition:opacity 1.2s ease;
}

/* PETALS */
.petal{
 position:fixed;
 width:18px;
 height:18px;
 background:radial-gradient(circle,#ff4b6e,#c4002c);
 border-radius:50% 50% 50% 0;
 transform:rotate(45deg);
 animation:fall linear infinite;
 opacity:.7;
}
@keyframes fall{
 from{transform:translateY(-10vh) rotate(0deg);}
 to{transform:translateY(110vh) rotate(360deg);}
}

button{
 margin-top:22px;
 padding:14px 26px;
 font-size:18px;
 border:none;
 border-radius:30px;
 background:linear-gradient(135deg,#ff2d55,#ff7a95);
 color:white;
 cursor:pointer;
 box-shadow:0 10px 40px rgba(255,45,85,.4);
}
</style>
</head>

<body>

<div id="loader">
  <h2>Preparing your bouquet… 🌹</h2>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</div>

<div class="card">
  <h1>Open your surprise</h1>

  <div class="bouquet" id="bouquetFrame">
    <img id="roseImg" src="./roses.jpg" alt="Bouquet of red roses">
  </div>

  <button onclick="window.location.href='call.html'">Answer your surprise 💌</button>
</div>

<script>
const loader  = document.getElementById("loader");
const bar     = document.getElementById("bar");
const img     = document.getElementById("roseImg");
const frame   = document.getElementById("bouquetFrame");

let progress=0;
let finished=false;

/* romantic fake loading */
const timer=setInterval(()=>{
  progress+=Math.random()*7;
  if(progress>94) progress=94;
  bar.style.width=progress+"%";
},180);

function setFrameToImageAspect(){
  if(!img.naturalWidth || !img.naturalHeight) return;

  // set modern aspect-ratio (best)
  frame.style.setProperty("--ar", `${img.naturalWidth} / ${img.naturalHeight}`);

  // set fallback padding-top (for older browsers)
  const pt = (img.naturalHeight / img.naturalWidth) * 100;
  frame.style.setProperty("--pt", pt.toFixed(4) + "%");
}

/* finish function — GUARANTEED to run */
function finish(){
  if(finished) return;
  finished=true;
  clearInterval(timer);
  bar.style.width="100%";

  setTimeout(()=>{
    loader.style.opacity="0";
    setTimeout(()=>loader.style.display="none",600);

    setFrameToImageAspect();     // <-- makes frame match roses.jpg exactly
    img.style.opacity=1;

    createPetals();
  },600);
}

/* image loads normally */
img.onload=()=>{
  setFrameToImageAspect();
  finish();
};

/* if image fails OR GitHub slow → still finish */
img.onerror=finish;

/* safety timeout (prevents stuck forever) */
setTimeout(finish,3200);

/* petals */
function createPetals(){
  for(let i=0;i<20;i++){
    let p=document.createElement("div");
    p.className="petal";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=6+Math.random()*6+"s";
    p.style.opacity=Math.random();
    document.body.appendChild(p);
  }
}
</script>

</body>
</html>
