<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your Roses 🌹</title>

<style>
:root{ --rose:#ff2d55; }
body{
  margin:0;
  font-family:system-ui;
  background: radial-gradient(circle at center,#1a0610,#050207);
  color:white;
  overflow-x:hidden;
}
#loader{
  position:fixed; inset:0;
  background:#050207;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  z-index:100;
}
.barwrap{ width:260px;height:10px;background:#222;border-radius:20px;overflow:hidden;margin-top:15px; }
.bar{ height:100%;width:0%; background:linear-gradient(90deg,#ff2d55,#ff9bb0); transition:width .2s; }

.card{ max-width:900px; margin:60px auto; padding:30px; text-align:center; }

.bouquet{
  position:relative; width:100%;
  border-radius:18px; overflow:hidden;
  box-shadow:0 25px 80px rgba(255,45,85,.25);
}
.bouquet::before{
  content:""; display:block; padding-top:56.25%;
  background: radial-gradient(circle at 30% 30%, rgba(255,45,85,.18), rgba(0,0,0,.65));
}
.bouquet img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1.2s ease;
}

button{
  margin-top:25px;
  padding:14px 26px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff2d55,#ff7a95);
  color:white;
  cursor:pointer;
  box-shadow:0 10px 40px rgba(255,45,85,.4);
}
</style>
</head>

<body>

<div id="loader">
  <h2>Preparing your bouquet… 🌹</h2>
  <div class="barwrap"><div class="bar" id="bar"></div></div>
</div>

<div class="card">
  <h1>Open your surprise</h1>

  <div class="bouquet">
    <img id="roseImg"
      src="./roses.jpg"
      alt="Bouquet of 15 red roses"
      decoding="async"
      loading="eager"
      fetchpriority="high">
  </div>

  <button onclick="window.location.href='call.html'">Answer your surprise 💌</button>
</div>

<script>
(() => {
  const loader = document.getElementById("loader");
  const bar = document.getElementById("bar");
  const img = document.getElementById("roseImg");
  if (!loader || !bar || !img) return;

  // progress animation
  let p = 0;
  const timer = setInterval(() => {
    p += Math.random() * 10;
    if (p > 95) p = 95;
    bar.style.width = p + "%";
  }, 140);

  let finished = false;
  function finishLoader() {
    if (finished) return;
    finished = true;
    clearInterval(timer);
    bar.style.width = "100%";
    setTimeout(() => loader.style.display = "none", 200);
  }

  // ✅ hide loader even if DOMContentLoaded already happened
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(finishLoader, 600));
  } else {
    setTimeout(finishLoader, 600);
  }

  // hard safety timeout
  setTimeout(finishLoader, 2200);

  // image fade in
  img.addEventListener("load", () => { img.style.opacity = 1; });
  img.addEventListener("error", () => {
    // If local image missing, show something instead of blank
    img.style.opacity = 0;
    console.warn("roses.jpg not found. Put roses.jpg in same folder as surprise.html");
  });

  // force reload the image src (helps if browser cached a fail)
  img.src = img.getAttribute("src") + "?v=" + Date.now();
})();
</script>

</body>
</html>
